name: Publicacion Blog

on:
  schedule:
    - cron: "0 12 * * 1"   # Lun 07:00 Peru — Analisis Semanal (datos)
    - cron: "0 12 * * 2"   # Mar 07:00 Peru — Comparativa de Tasas (datos)
    - cron: "0 12 * * 3"   # Mie 07:00 Peru — Pulso Media Semana (datos)
    - cron: "0 12 * * 4"   # Jue 07:00 Peru — Guia Financiera (evergreen)
    - cron: "0 12 * * 6"   # Sab 07:00 Peru — Guia Financiera (evergreen)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
